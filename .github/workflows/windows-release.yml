name: Build Windows executable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-build.txt

      - name: Run offline tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Build executable
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --name UnlockOverwatchRank
          --paths src src/ow_automation/cli.py

      - name: Package executable and checksum
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          Compress-Archive -Path dist/UnlockOverwatchRank.exe -DestinationPath "dist/UnlockOverwatchRank-$tag-windows-x64.zip"
          (Get-FileHash "dist/UnlockOverwatchRank-$tag-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline "dist/UnlockOverwatchRank-$tag-windows-x64.zip.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          gh release create $tag "dist/UnlockOverwatchRank-$tag-windows-x64.zip" "dist/UnlockOverwatchRank-$tag-windows-x64.zip.sha256" --title "UnlockOverwatchRank $tag" --generate-notes
